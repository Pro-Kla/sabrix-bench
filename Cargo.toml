[package]
name = "sabrix-bench"
version = "0.1.3"
edition = "2021"
description = "⚡ Fast MCP JSON-RPC inspector & multi-turn agent latency benchmark in Rust"
authors = ["Chandradeep <chandradeep@sabrix.ai>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Pro-Kla/sabrix-bench"
homepage = "https://sabrix.ai"
readme = "README.md"
keywords = ["mcp", "agent", "benchmark", "json-rpc", "security"]
categories = ["command-line-utilities", "development-tools::profiling"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
indicatif = "0.17"
comfy-table = "7.1"
anyhow = "1.0"
