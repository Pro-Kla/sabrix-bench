[package]
name = "sabrix-bench"
version = "0.1.0"
edition = "2021"
description = "Fast, zero-bloat developer CLI and benchmark tool for Model Context Protocol (MCP) inspection and agent latency analysis."
authors = ["Sabrix Open Source Team <oss@sabrix.ai>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
keywords = ["mcp", "agent", "benchmark", "json-rpc", "security"]
categories = ["command-line-utilities", "development-tools::profiling"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
indicatif = "0.17"
comfy-table = "7.1"
anyhow = "1.0"
